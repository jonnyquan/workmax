name: Bug report
description: Report a reproducible problem in WorkMax
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve WorkMax. Do not include credentials, personal data, or security vulnerabilities. Follow SECURITY.md for private vulnerability reporting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, tokens, personal data, and private URLs.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Provide the release version or full commit SHA.
      placeholder: 0.1.0-p1-ea or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Go Server
        - Desktop shell (Wails)
        - Desktop renderer
        - Build or packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include operating system, architecture, Go version, and Node.js version when relevant.
      placeholder: macOS 15, arm64, Go 1.24.4, Node.js 20.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Run ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs or screenshots if they help explain the issue.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification performed
      description: List relevant commands such as make doctor or focused test targets and their results.
  - type: textarea
    id: additional
    attributes:
      label: Additional context
