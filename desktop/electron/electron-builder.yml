# electron-builder config for WorkMax Desktop.
#
# Used by desktop/scripts/build-mac.sh. Invoke via:
#   npx electron-builder --mac --<arch> --publish never
#
# Output lands in desktop/electron/release/.
directories:
  output: release

# App id MUST match the Keychain service the sidecar uses
# (server/desktop/cloud_proxy/keychain.go::KeychainService).
# macOS scopes Keychain entries by the calling app's bundle id;
# diverging would mean the packaged build can't see entries the
# dev (un-bundled) build wrote, and vice-versa.
appId: ai.workmax.desktop
productName: WorkMax Desktop

# We compile TypeScript ourselves before invoking electron-builder
# (see build-mac.sh), so the packaged app only needs the compiled
# JS + the runtime sidecar binary. node_modules is needed for
# Electron itself; src/ + tsconfig.json + the typescript devDep
# would just bloat the bundle.
files:
  - dist/main.js
  - dist/main-log.js
  - dist/desktop-bridge.js
  - dist/oauth-window.js
  - dist/preload.js
  - dist/renderer-loader.js
  - dist/security-helpers.js
  - dist/sidecar-manager.js
  - dist/smoke-diagnostics.js
  - package.json
  - "!node_modules/typescript/**"
  - "!node_modules/@types/**"
  - "!src/**"

# Where the sidecar binary lives inside the packaged app.
# extraResources is preferred over extraFiles because it goes
# into the Resources/ folder (signable on macOS).
extraResources:
  - from: bin/workagent-desktop
    to: workagent-desktop
    filter:
      - "**/*"
  - from: ../renderer
    to: renderer
    filter:
      - "**/*"
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: bin/third-party-licenses
    to: third-party-licenses
    filter:
      - "**/*"
  - from: node_modules/electron/dist/LICENSE
    to: third-party-licenses/electron/LICENSE
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: third-party-licenses/electron/LICENSES.chromium.html

mac:
  category: public.app-category.productivity
  # x64 + arm64 are produced separately by build-mac.sh / npm wrappers.
  # Do not pin arch here; the CLI --arm64 / --x64 flag is the source of truth
  # for a given package pass.
  target:
    - dmg
    - zip
  # Hardened runtime + entitlements are required for notarization.
  # build-mac.sh deliberately leaves notarization to the separate
  # desktop/scripts/notarize-mac.sh post-build gate because early-access
  # smoke builds may be unsigned while public distribution must be
  # Developer ID signed, submitted, stapled, and verified.
  hardenedRuntime: true
  entitlements: ../build/entitlements.mac.plist
  entitlementsInherit: ../build/entitlements.mac.plist
  gatekeeperAssess: false # we self-test before signing for distribution

  # Reviewed Desktop icon asset; public-release inspection
  # requires the packaged app to declare CFBundleIconFile=icon.icns and
  # include a non-empty Contents/Resources/icon.icns.
  icon: ../build/icons/icon.icns

# Artifact filename pattern. Defaults are fine but pinned here so
# build-mac.sh can predict the path.
artifactName: ${productName}-${version}-${arch}.${ext}

# DMG window appearance — keep defaults for now. Real release pass
# should set up a background image with drag-to-Applications arrow.
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# We don't auto-publish anywhere yet. Always --publish never.
publish: null
